name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dgap_test
          POSTGRES_USER: dgap
          POSTGRES_PASSWORD: dgap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dgap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key-min-32-caracteres-pour-jwt
      POSTGRES_DB: dgap_test
      POSTGRES_USER: dgap
      POSTGRES_PASSWORD: dgap
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # OCR (apps.ged, EF-602) : le runner ubuntu-latest ne fournit pas Tesseract par
      # défaut, contrairement à l'image Docker du backend — sans cet apt-get, tous les
      # tests OCR échouent silencieusement (ECHEC au lieu de TRAITE, exception avalée
      # par le patron best-effort d'`extraire_texte_ocr`).
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest
      - name: Audit des dépendances Python
        # `--skip-editable` n'empêche pas pip-audit d'échouer sur le paquet éditable
        # du projet lui-même (dgap-backend, installé via `-e .`) quand on audite
        # l'environnement directement : on limite donc l'audit aux dépendances
        # tierces (pip freeze --exclude-editable), le seul périmètre pertinent —
        # notre propre code n'est de toute façon pas publié sur PyPI.
        run: |
          pip install pip-audit
          pip freeze --exclude-editable > /tmp/requirements-audit.txt
          pip-audit -r /tmp/requirements-audit.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile=false
      # @dgap/config n'a pas de tsc (presets JS purs Tailwind/ESLint, rien à
      # type-checker) — l'exclure sinon `pnpm -r` échoue sur "Command tsc not found".
      - run: pnpm --filter '!@dgap/config' -r exec tsc --noEmit
      - run: pnpm -r lint
      - run: pnpm -r --filter=./apps/* build
      - run: pnpm --filter @dgap/ui build-storybook
      - name: Audit des dépendances npm
        run: pnpm audit --audit-level=high || true # non bloquant tant que le graphe de deps n'est pas stabilisé (Phase 0)

  scan-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t dgap-backend:ci ./backend
      - name: Scan Trivy — image backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dgap-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
