name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dgap_test
          POSTGRES_USER: dgap
          POSTGRES_PASSWORD: dgap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dgap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key-min-32-caracteres-pour-jwt
      POSTGRES_DB: dgap_test
      POSTGRES_USER: dgap
      POSTGRES_PASSWORD: dgap
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest
      - name: Audit des dépendances Python
        run: pip install pip-audit && pip-audit --strict --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r exec tsc --noEmit
      - run: pnpm -r lint
      - run: pnpm -r --filter=./apps/* build
      - run: pnpm --filter @dgap/ui build-storybook
      - name: Audit des dépendances npm
        run: pnpm audit --audit-level=high || true # non bloquant tant que le graphe de deps n'est pas stabilisé (Phase 0)

  scan-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t dgap-backend:ci ./backend
      - name: Scan Trivy — image backend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: dgap-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
