# En-têtes de sécurité communs (Tableau 42 du cahier des charges, §9.3).
# Inclus par chaque bloc server (public et interne) ; les CSP précises (sources
# autorisées par zone) sont définies dans le bloc server appelant, car elles
# diffèrent selon que le site sert des assets statiques (portail) ou une SPA
# consommant l'API (démarches/intranet/admin).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
add_header X-Frame-Options "DENY" always;
