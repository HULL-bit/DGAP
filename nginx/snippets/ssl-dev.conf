# Certificat auto-signé de développement (généré par `make certs`, jamais utilisé en
# production — voir docs/exploitation.md pour la procédure Let's Encrypt/ACME cible).
ssl_certificate     /etc/nginx/certs/dev.crt;
ssl_certificate_key /etc/nginx/certs/dev.key;
ssl_protocols TLSv1.3 TLSv1.2;
ssl_prefer_server_ciphers off;
