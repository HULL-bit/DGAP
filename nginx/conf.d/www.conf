# Portail institutionnel — www.administrationpenitentiaire.sn
# SSG/prerender (docs/adr/0001-seo-rendering.md), cache long sur les assets, indexable.

server {
    listen 443 ssl;
    http2 on;
    server_name www.administrationpenitentiaire.sn administrationpenitentiaire.sn www.localhost;

    include /etc/nginx/snippets/ssl-dev.conf;
    include /etc/nginx/snippets/securite-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://storage.localhost https://storage.administrationpenitentiaire.sn; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://www.administrationpenitentiaire.sn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html/portail;
    index index.html;

    limit_req zone=zone_generale burst=80 nodelay;

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Back-office/intranet interne (RH, GED, courrier, comptes, détenus...) : jamais
    # accessible depuis la zone publique, quel que soit le résultat des vérifications
    # applicatives (défense en profondeur, §6.3). Préfixe plus spécifique que le
    # bloc générique ci-dessous : gagne par la règle du préfixe le plus long.
    location /api/v1/backoffice/ {
        return 404;
    }

    # Passerelle vers MinIO, même origine que le reste de l'app (voir core/storage.py
    # côté backend — les URLs générées sont relatives, jamais storage.localhost en
    # absolu) : évite tout problème de confiance TLS cross-origine en dev. Le nom
    # d'hôte forcé ici (storage.localhost) est celui utilisé à la signature — SigV4
    # l'exige, voir storage.conf — indépendant du domaine réellement visité.
    location ^~ /dgap-medias/ {
        proxy_pass http://minio_storage;
        proxy_set_header Host storage.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        limit_req zone=zone_generale burst=50 nodelay;
        proxy_pass http://backend_django/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    location / {
        # Voir demarches.conf : sans ceci, un index.html mis en cache navigateur
        # peut continuer à référencer un bundle JS obsolète après un déploiement.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
