# Portail institutionnel — www.administrationpenitentiaire.sn
# SSG/prerender (docs/adr/0001-seo-rendering.md), cache long sur les assets, indexable.

server {
    listen 443 ssl;
    http2 on;
    server_name www.administrationpenitentiaire.sn administrationpenitentiaire.sn www.localhost;

    include /etc/nginx/snippets/ssl-dev.conf;
    include /etc/nginx/snippets/securite-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://www.administrationpenitentiaire.sn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html/portail;
    index index.html;

    limit_req zone=zone_generale burst=40 nodelay;

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/v1/ {
        limit_req zone=zone_generale burst=20 nodelay;
        proxy_pass http://backend_django/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
