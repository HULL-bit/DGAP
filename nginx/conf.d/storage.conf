# Passerelle vers MinIO — storage.localhost
#
# Le backend signe les URLs (permis PDF, pièces jointes, médias de galerie) avec
# `MINIO_ENDPOINT_URL` : le nom d'hôte utilisé au moment de la signature doit être
# strictement identique à celui vu par MinIO au moment de la requête, faute de quoi
# la vérification de signature SigV4 échoue. On fait donc pointer
# `MINIO_ENDPOINT_URL` sur ce même hôte `storage.localhost` (résolu à la fois par le
# réseau Docker — alias sur le service nginx — et par le navigateur, `*.localhost`
# se résolvant nativement en boucle locale). `proxy_set_header Host $host` préserve
# ce nom d'hôte de bout en bout : c'est ce qui rend le lien accessible aussi bien
# aux agents (permis, pièces jointes visites) qu'au public (médias de galerie).
upstream minio_storage {
    server minio:9000;
}

server {
    listen 443 ssl;
    http2 on;
    server_name storage.localhost;

    include /etc/nginx/snippets/ssl-dev.conf;
    include /etc/nginx/snippets/securite-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://minio_storage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
