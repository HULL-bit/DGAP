# Back-office / Admin — admin.administrationpenitentiaire.sn
# CMS éditorial, instruction, campagnes, statistiques. Restreint, non indexable.

server {
    listen 443 ssl;
    http2 on;
    server_name admin.administrationpenitentiaire.sn admin.localhost;

    # Allow-list VPN/IP d'État — à renseigner en préproduction/production.
    # allow 10.0.0.0/8;
    # deny all;

    include /etc/nginx/snippets/ssl-dev.conf;
    include /etc/nginx/snippets/securite-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://admin.administrationpenitentiaire.sn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html/backoffice;
    index index.html;

    client_max_body_size 25m; # médiathèque back-office : imports plus volumineux

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/v1/auth/ {
        limit_req zone=zone_auth burst=5 nodelay;
        proxy_pass http://backend_django/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    location /api/v1/ {
        proxy_pass http://backend_django/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
