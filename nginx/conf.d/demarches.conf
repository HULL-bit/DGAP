# Téléservices citoyens — demarches.administrationpenitentiaire.sn
# SPA sécurisée, cookies de session distincts de la zone publique, rate-limit dépôts/suivi.

server {
    listen 443 ssl;
    http2 on;
    server_name demarches.administrationpenitentiaire.sn demarches.localhost;

    include /etc/nginx/snippets/ssl-dev.conf;
    include /etc/nginx/snippets/securite-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://storage.localhost https://storage.administrationpenitentiaire.sn; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://demarches.administrationpenitentiaire.sn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html/demarches;
    index index.html;

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dépôt de demandes (visites, candidatures) — idempotence côté API, rate-limit ici.
    location ~ ^/api/v1/(demandes-visite|concours/[^/]+/candidatures)$ {
        limit_req zone=zone_depot burst=10 nodelay;
        proxy_pass http://backend_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    # Suivi de demande par numéro — public restreint.
    location ~ ^/api/v1/demandes-visite/[^/]+/statut$ {
        limit_req zone=zone_suivi burst=15 nodelay;
        proxy_pass http://backend_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=zone_auth burst=5 nodelay;
        proxy_pass http://backend_django/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    # Back-office/intranet interne : jamais accessible depuis la zone citoyenne,
    # quel que soit le résultat des vérifications applicatives (défense en
    # profondeur, §6.3). Préfixe plus spécifique que le bloc générique ci-dessous.
    location /api/v1/backoffice/ {
        return 404;
    }

    location /api/v1/ {
        limit_req zone=zone_generale burst=30 nodelay;
        proxy_pass http://backend_django/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
