# Intranet agents — intranet.administrationpenitentiaire.sn
# Réservé au réseau interne (VPN d'État) + MFA applicatif. Non indexable.

server {
    listen 443 ssl;
    http2 on;
    server_name intranet.administrationpenitentiaire.sn intranet.localhost;

    # Allow-list VPN/IP d'État — à renseigner en préproduction/production.
    # Laissé ouvert en développement local (profil `dev` du docker-compose).
    # allow 10.0.0.0/8;
    # deny all;

    include /etc/nginx/snippets/ssl-dev.conf;
    include /etc/nginx/snippets/securite-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://storage.localhost https://storage.administrationpenitentiaire.sn; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://intranet.administrationpenitentiaire.sn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html/intranet;
    index index.html;

    location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/v1/auth/ {
        limit_req zone=zone_auth burst=5 nodelay;
        proxy_pass http://backend_django/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    # Dossier détenu (M10) : la population agent de l'intranet n'a rien à y faire
    # (seul admin.localhost sert la console RH/GED/comptes qui, elle, y donne
    # accès aux seuls agents habilités par scope+périmètre). Défense en
    # profondeur, §6.3 — plus spécifique que le bloc générique ci-dessous, donc
    # prioritaire par la règle du préfixe le plus long.
    location /api/v1/backoffice/detenus/ {
        return 404;
    }

    location /api/v1/ {
        proxy_pass http://backend_django/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Strict; Secure";
    }

    location / {
        # Voir demarches.conf : sans ceci, un index.html mis en cache navigateur
        # peut continuer à référencer un bundle JS obsolète après un déploiement.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
