user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format dgap '$remote_addr - $host [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log dgap;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/font-woff2;

    # Uploads : taille max contrôlée (§9.3) — affinée par site ci-dessous si besoin.
    client_max_body_size 15m;

    # Zones de limitation de débit (§9.3) — dépôt de demandes, suivi, authentification.
    limit_req_zone $binary_remote_addr zone=zone_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=zone_depot:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=zone_suivi:10m rate=30r/m;
    # 120r/m avec un burst de 20-40 s'est révélé trop serré en usage réel : une seule
    # page du portail déclenche plusieurs appels API en parallèle au montage (galeries,
    # documents, boutique...), et ce budget se sature en quelques rechargements normaux.
    # Lecture seule, contenu public, aucun risque d'abus comparable à zone_auth/zone_depot.
    limit_req_zone $binary_remote_addr zone=zone_generale:10m rate=300r/m;
    limit_req_status 429;

    # En-têtes de sécurité communs (§9.3) — voir snippets/securite-headers.conf,
    # inclus explicitement par chaque bloc server sous conf.d/.

    upstream backend_django {
        server backend:8000;
    }

    include /etc/nginx/conf.d/*.conf;
}
