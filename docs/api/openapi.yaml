        `image_url` est calculée (jamais stockée telle quelle) : voir `Article.image` et
        `ArticleBackofficeViewSet.televerser_image`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titre:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        chapo:
          type: string
          description: Résumé affiché dans les listes.
        contenu:
          type: string
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutContenuEnum'
          readOnly: true
        rubrique:
          type:
          - string
          - 'null'
          format: uuid
        date_publication:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        image_url:
          type: string
          readOnly: true
        galerie:
          type:
          - string
          - 'null'
          format: uuid
          description: Galerie d'images/vidéos complémentaires affichée sous l'article.
        meta_titre:
          type: string
          maxLength: 200
        meta_description:
          type: string
          maxLength: 300
        cree_le:
          type: string
          format: date-time
          readOnly: true
        modifie_le:
          type: string
          format: date-time
          readOnly: true
    PatchedConcoursBackoffice:
      type: object
      description: |-
        CRUD back-office (scope `concours:gerer`). `document_avis` se renseigne via
        l'action dédiée `televerser_avis` (téléversement direct), jamais en écrivant
        l'identifiant de `DocumentPublic` à la main.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titre:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        conditions:
          type: string
          description: Conditions d'accès, pièces exigées.
        frais_inscription:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          description: Montant en FCFA.
        date_ouverture:
          type: string
          format: date
        date_cloture:
          type: string
          format: date
        date_concours:
          type:
          - string
          - 'null'
          format: date
        places_disponibles:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
        statut:
          $ref: '#/components/schemas/StatutConcoursEnum'
        document_avis_url:
          type: string
          readOnly: true
        cree_le:
          type: string
          format: date-time
          readOnly: true
        modifie_le:
          type: string
          format: date-time
          readOnly: true
