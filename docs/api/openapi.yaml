components:
  schemas:
    ActeCarriere:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        numero:
          type: string
          readOnly: true
        dossier:
          type: string
          format: uuid
        dossier_nom:
          type: string
          readOnly: true
        type_acte:
          $ref: '#/components/schemas/TypeActeEnum'
        statut:
          allOf:
          - $ref: '#/components/schemas/ActeCarriereStatutEnum'
          readOnly: true
        date_effet:
          type: string
          format: date
        motif:
          type: string
        nouveau_grade:
          type: string
          maxLength: 150
        nouveau_perimetre:
          type:
          - string
          - 'null'
          format: uuid
          description: Renseigné pour une mutation.
        nouveau_perimetre_libelle:
          type: string
          readOnly: true
          default: ''
        nouvelle_fonction:
          type: string
          maxLength: 200
        valide_par_nom:
          type: string
          readOnly: true
        date_validation:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        motif_rejet:
          type: string
          readOnly: true
        cree_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - cree_le
      - date_effet
      - date_validation
      - dossier
      - dossier_nom
      - id
      - motif_rejet
      - nouveau_perimetre_libelle
      - numero
      - statut
      - type_acte
      - valide_par_nom
    ActeCarriereStatutEnum:
      enum:
      - BROUILLON
      - SOUMIS
      - VALIDE
      - REJETE
      type: string
      description: |-
        * `BROUILLON` - Brouillon
        * `SOUMIS` - Soumis
        * `VALIDE` - Validé
        * `REJETE` - Rejeté
    AffectationAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        perimetre:
          type: string
          format: uuid
        perimetre_libelle:
          type: string
          readOnly: true
        fonction:
          type: string
          maxLength: 200
        date_debut:
          type: string
          format: date
        date_fin:
          type:
          - string
          - 'null'
          format: date
        est_active:
          type: boolean
          readOnly: true
      required:
      - date_debut
      - est_active
      - id
      - perimetre
      - perimetre_libelle
    AffectationCourrier:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        perimetre_libelle:
          type: string
          readOnly: true
          default: ''
        agent_nom:
          type: string
          readOnly: true
        instructions:
          type: string
          readOnly: true
        affecte_par_nom:
          type: string
          readOnly: true
        cree_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - affecte_par_nom
      - agent_nom
      - cree_le
      - id
      - instructions
      - perimetre_libelle
    AffectationRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        utilisateur:
          type: string
          format: uuid
        role:
          type: string
          format: uuid
        role_libelle:
          type: string
          readOnly: true
        perimetre:
          type:
          - string
          - 'null'
          format: uuid
          description: Vide = portée nationale (réservé aux rôles habilités).
        perimetre_libelle:
          type: string
          readOnly: true
          default: National
        actif:
          type: boolean
        date_debut:
          type: string
          format: date
        date_fin:
          type:
          - string
          - 'null'
          format: date
      required:
      - id
      - perimetre_libelle
      - role
      - role_libelle
      - utilisateur
    Annuaire:
      type: object
      description: |-
        Annuaire interne (EF-706) — champs minimaux, jamais la situation familiale,
        les diplômes ou les soldes de congé.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nom:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        telephone:
          type: string
          readOnly: true
        corps:
          type: string
          readOnly: true
        grade:
          type: string
          readOnly: true
        fonction_actuelle:
          type: string
          readOnly: true
        perimetre_actuel_libelle:
          type: string
          readOnly: true
      required:
      - corps
      - email
      - fonction_actuelle
      - grade
      - id
      - nom
      - perimetre_actuel_libelle
      - telephone
    ArticleBackoffice:
      type: object
      description: |-
        CRUD éditorial complet — auteur/dates en lecture seule, reste modifiable.

        `image_url` est calculée (jamais stockée telle quelle) : voir `Article.image` et
        `ArticleBackofficeViewSet.televerser_image`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titre:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        chapo:
          type: string
          description: Résumé affiché dans les listes.
        contenu:
          type: string
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutContenuEnum'
          readOnly: true
        rubrique:
          type:
          - string
          - 'null'
          format: uuid
        date_publication:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        image_url:
          type: string
          readOnly: true
        galerie:
          type:
          - string
          - 'null'
          format: uuid
          description: Galerie d'images/vidéos complémentaires affichée sous l'article.
        meta_titre:
          type: string
          maxLength: 200
        meta_description:
          type: string
          maxLength: 300
        cree_le:
          type: string
          format: date-time
          readOnly: true
        modifie_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - cree_le
      - date_publication
      - id
      - image_url
      - modifie_le
      - slug
      - statut
      - titre
    ArticleDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titre:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        chapo:
          type: string
          readOnly: true
          description: Résumé affiché dans les listes.
        contenu:
          type: string
          readOnly: true
        rubrique:
          allOf:
          - $ref: '#/components/schemas/Rubrique'
          readOnly: true
        date_publication:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        image_url:
          type: string
          readOnly: true
        galerie_code:
          type: string
          readOnly: true
        meta_titre:
          type: string
          readOnly: true
        meta_description:
          type: string
          readOnly: true
      required:
      - chapo
      - contenu
      - date_publication
      - galerie_code
      - id
      - image_url
