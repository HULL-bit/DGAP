          format: uuid
        date_publication:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        image_url:
          description: Placeholder — médiathèque MinIO au Bloc B/C.
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        meta_titre:
          type: string
          maxLength: 200
        meta_description:
