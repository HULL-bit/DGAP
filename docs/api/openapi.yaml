openapi: 3.1.0
info:
  title: API DGAP
  version: 1.0.0
  description: Direction Générale de l'Administration Pénitentiaire — Sénégal. API
    REST v1.
paths:
  /api/v1/articles:
    get:
      operationId: articles_list
      description: GET /api/v1/articles?rubrique=&q= — actualités publiées uniquement
        (§7.2).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - articles
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListeList'
          description: ''
  /api/v1/articles/{slug}:
    get:
      operationId: articles_retrieve
      description: GET /api/v1/articles/{slug} — publique, uniquement les articles
        publiés.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/auth/connexion:
    post:
      operationId: auth_connexion_create
      description: POST /api/v1/auth/connexion — émet un jeton JWT, exige MFA pour
        les comptes internes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Connexion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connexion'
          description: ''
  /api/v1/auth/mfa/confirmation:
    post:
      operationId: auth_mfa_confirmation_create
      description: POST /api/v1/auth/mfa/confirmation — valide le premier code et
        active le MFA.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationMFARequete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmationMFARequete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmationMFARequete'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationMFAReponse'
          description: ''
  /api/v1/auth/mfa/inscription:
    post:
      operationId: auth_mfa_inscription_create
      description: |-
        POST /api/v1/auth/mfa/inscription — crée (ou réutilise) un dispositif TOTP non
        confirmé + QR.

        Idempotent tant que l'inscription n'est pas confirmée : un rechargement de page,
        un double appel React (StrictMode) ou une nouvelle visite de l'écran d'inscription
        renvoient le même secret plutôt que d'en générer un nouveau à chaque fois — sinon
        le QR déjà scanné par l'utilisateur devient invalide silencieusement.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscriptionMFAReponse'
          description: ''
  /api/v1/auth/moi:
    get:
      operationId: auth_moi_retrieve
      description: GET /api/v1/auth/moi — profil, scopes et périmètres de l'utilisateur
        courant.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
  /api/v1/auth/rafraichissement:
    post:
      operationId: auth_rafraichissement_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/backoffice/articles:
    get:
      operationId: backoffice_articles_list
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleBackofficeList'
          description: ''
    post:
      operationId: backoffice_articles_create
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
  /api/v1/backoffice/articles/{id}:
    get:
      operationId: backoffice_articles_retrieve
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
    put:
      operationId: backoffice_articles_update
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
    patch:
      operationId: backoffice_articles_partial_update
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleBackoffice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
    delete:
      operationId: backoffice_articles_destroy
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/backoffice/articles/{id}/image:
    post:
      operationId: backoffice_articles_image_create
      description: |-
        POST .../{id}/image — téléverse l'image à la une. DELETE .../{id}/image —
        la retire. `image` est un `ImageField` réel (jamais un `image_url` stocké en
        base) : l'URL exposée par l'API est presignée à la lecture, jamais persistée.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageArticleUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageArticleUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageArticleUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageArticleReponse'
          description: ''
    delete:
      operationId: backoffice_articles_image_destroy
      description: |-
        POST .../{id}/image — téléverse l'image à la une. DELETE .../{id}/image —
        la retire. `image` est un `ImageField` réel (jamais un `image_url` stocké en
        base) : l'URL exposée par l'API est presignée à la lecture, jamais persistée.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/backoffice/articles/{id}/transition:
    post:
      operationId: backoffice_articles_transition_create
      description: |-
        POST .../{id}/transition — {"action": "soumettre|valider|..."}.

        Actions possibles : soumettre, valider, rejeter, publier, archiver, reactiver.
        Voir `TRANSITIONS_AUTORISEES` (models.py) pour la matrice complète.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transition'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/backoffice/articles/{id}/versions:
    get:
      operationId: backoffice_articles_versions_retrieve
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
  /api/v1/backoffice/articles/{id}/versions/{numero}/restaurer:
    post:
      operationId: backoffice_articles_versions_restaurer_create
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      - in: path
        name: numero
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
  /api/v1/backoffice/audit/journal:
    get:
      operationId: backoffice_audit_journal_list
      description: |-
        GET /api/v1/backoffice/audit/journal?acteur=&action=&ressource_type=&
        depuis=&jusqu_a= — consultation habilitée du journal d'audit central,
        inaltérable (EF-1504).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalActionList'
          description: ''
  /api/v1/backoffice/boutique/produits:
    get:
      operationId: backoffice_boutique_produits_list
      description: |-
        GET/POST /api/v1/backoffice/boutique/produits — gestion du catalogue
        (scope `boutique:gerer`).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProduitBoutiqueBackofficeList'
          description: ''
    post:
      operationId: backoffice_boutique_produits_create
      description: |-
        GET/POST /api/v1/backoffice/boutique/produits — gestion du catalogue
        (scope `boutique:gerer`).
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          description: ''
  /api/v1/backoffice/boutique/produits/{id}:
    get:
      operationId: backoffice_boutique_produits_retrieve
      description: GET/PATCH/DELETE /api/v1/backoffice/boutique/produits/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          description: ''
    put:
      operationId: backoffice_boutique_produits_update
      description: GET/PATCH/DELETE /api/v1/backoffice/boutique/produits/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          description: ''
    patch:
      operationId: backoffice_boutique_produits_partial_update
      description: GET/PATCH/DELETE /api/v1/backoffice/boutique/produits/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduitBoutiqueBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduitBoutiqueBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduitBoutiqueBackoffice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitBoutiqueBackoffice'
          description: ''
    delete:
      operationId: backoffice_boutique_produits_destroy
      description: GET/PATCH/DELETE /api/v1/backoffice/boutique/produits/{id}.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/backoffice/boutique/produits/{id}/image:
    post:
      operationId: backoffice_boutique_produits_image_create
      description: |-
        POST/DELETE /api/v1/backoffice/boutique/produits/{id}/image — téléverse ou
        retire la photo du produit. `image` est un `ImageField` réel : l'URL exposée par
        l'API est presignée à la lecture, jamais persistée (voir `ProduitBoutique.image`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageProduitUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageProduitUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageProduitUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageProduitReponse'
          description: ''
    delete:
      operationId: backoffice_boutique_produits_image_destroy
      description: |-
        POST/DELETE /api/v1/backoffice/boutique/produits/{id}/image — téléverse ou
        retire la photo du produit. `image` est un `ImageField` réel : l'URL exposée par
        l'API est presignée à la lecture, jamais persistée (voir `ProduitBoutique.image`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/backoffice/comptes/affectations-role:
    post:
      operationId: backoffice_comptes_affectations_role_create
      description: |-
        POST /api/v1/backoffice/comptes/affectations-role — attribution d'un rôle
        à un utilisateur, sur un périmètre (EF-1501).
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffectationRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AffectationRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AffectationRole'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffectationRole'
          description: ''
  /api/v1/backoffice/comptes/affectations-role/{id}/revoquer:
    post:
      operationId: backoffice_comptes_affectations_role_revoquer_create
      description: |-
        POST /api/v1/backoffice/comptes/affectations-role/{id}/revoquer — jamais de
        suppression physique : `actif=False` préserve l'historique d'habilitation
        (EF-1501, revues périodiques).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffectationRole'
          description: ''
  /api/v1/backoffice/comptes/attributions-permission:
    post:
      operationId: backoffice_comptes_attributions_permission_create
      description: |-
        POST /api/v1/backoffice/comptes/attributions-permission — délégation
        temporaire ou habilitation individuelle hors rôle (EF-1501).
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionPermission'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributionPermission'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributionPermission'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionPermission'
          description: ''
  /api/v1/backoffice/comptes/attributions-permission/{id}/revoquer:
    post:
      operationId: backoffice_comptes_attributions_permission_revoquer_create
      description: |-
        POST /api/v1/backoffice/comptes/attributions-permission/{id}/revoquer
        (EF-1501).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionPermission'
          description: ''
  /api/v1/backoffice/comptes/permissions:
    get:
      operationId: backoffice_comptes_permissions_list
      description: |-
        GET /api/v1/backoffice/comptes/permissions — référentiel en lecture seule
        des permissions définies par les modules (EF-1501).
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
