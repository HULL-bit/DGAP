openapi: 3.1.0
info:
  title: API DGAP
  version: 1.0.0
  description: Direction Générale de l'Administration Pénitentiaire — Sénégal. API
    REST v1.
paths:
  /api/v1/articles:
    get:
      operationId: articles_list
      description: GET /api/v1/articles?rubrique=&q= — actualités publiées uniquement
        (§7.2).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - articles
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListeList'
          description: ''
  /api/v1/articles/{slug}:
    get:
      operationId: articles_retrieve
      description: GET /api/v1/articles/{slug} — publique, uniquement les articles
        publiés.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/auth/connexion:
    post:
      operationId: auth_connexion_create
      description: POST /api/v1/auth/connexion — émet un jeton JWT, exige MFA pour
        les comptes internes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Connexion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connexion'
          description: ''
  /api/v1/auth/mfa/confirmation:
    post:
      operationId: auth_mfa_confirmation_create
      description: POST /api/v1/auth/mfa/confirmation — valide le premier code et
        active le MFA.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationMFARequete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmationMFARequete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmationMFARequete'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationMFAReponse'
          description: ''
  /api/v1/auth/mfa/inscription:
    post:
      operationId: auth_mfa_inscription_create
      description: POST /api/v1/auth/mfa/inscription — crée un dispositif TOTP non
        confirmé + QR.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscriptionMFAReponse'
          description: ''
  /api/v1/auth/moi:
    get:
      operationId: auth_moi_retrieve
      description: GET /api/v1/auth/moi — profil, scopes et périmètres de l'utilisateur
        courant.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'
          description: ''
  /api/v1/auth/rafraichissement:
    post:
      operationId: auth_rafraichissement_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/backoffice/articles:
    get:
      operationId: backoffice_articles_list
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleBackofficeList'
          description: ''
    post:
      operationId: backoffice_articles_create
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
  /api/v1/backoffice/articles/{id}:
    get:
      operationId: backoffice_articles_retrieve
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
    put:
      operationId: backoffice_articles_update
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
    patch:
      operationId: backoffice_articles_partial_update
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleBackoffice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
    delete:
      operationId: backoffice_articles_destroy
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/backoffice/articles/{id}/transition:
    post:
      operationId: backoffice_articles_transition_create
      description: |-
        POST .../{id}/transition — {"action": "soumettre|valider|..."}.

        Actions possibles : soumettre, valider, rejeter, publier, archiver, reactiver.
        Voir `TRANSITIONS_AUTORISEES` (models.py) pour la matrice complète.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transition'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/backoffice/articles/{id}/versions:
    get:
      operationId: backoffice_articles_versions_retrieve
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
  /api/v1/backoffice/articles/{id}/versions/{numero}/restaurer:
    post:
      operationId: backoffice_articles_versions_restaurer_create
      description: CRUD + workflow éditorial des articles — `/api/v1/backoffice/articles`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) article.
        required: true
      - in: path
        name: numero
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleBackoffice'
          description: ''
  /api/v1/backoffice/pages:
    get:
      operationId: backoffice_pages_list
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageBackofficeList'
          description: ''
    post:
      operationId: backoffice_pages_create
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBackoffice'
          description: ''
  /api/v1/backoffice/pages/{id}:
    get:
      operationId: backoffice_pages_retrieve
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBackoffice'
          description: ''
    put:
      operationId: backoffice_pages_update
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBackoffice'
          description: ''
    patch:
      operationId: backoffice_pages_partial_update
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPageBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPageBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPageBackoffice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBackoffice'
          description: ''
    delete:
      operationId: backoffice_pages_destroy
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/backoffice/pages/{id}/transition:
    post:
      operationId: backoffice_pages_transition_create
      description: |-
        POST .../{id}/transition — {"action": "soumettre|valider|..."}.

        Actions possibles : soumettre, valider, rejeter, publier, archiver, reactiver.
        Voir `TRANSITIONS_AUTORISEES` (models.py) pour la matrice complète.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transition'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/backoffice/pages/{id}/versions:
    get:
      operationId: backoffice_pages_versions_retrieve
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBackoffice'
          description: ''
  /api/v1/backoffice/pages/{id}/versions/{numero}/restaurer:
    post:
      operationId: backoffice_pages_versions_restaurer_create
      description: CRUD + workflow éditorial des pages — `/api/v1/backoffice/pages`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) page.
        required: true
      - in: path
        name: numero
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PageBackoffice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBackoffice'
          description: ''
  /api/v1/contacts:
    post:
      operationId: contacts_create
      description: |-
        POST /api/v1/contacts — formulaire tracé, accusé automatique avec n° de ticket (§7.2).

        Note d'exploitation : l'envoi de l'accusé par e-mail/SMS est délégué à
        `apps.notifications` (non encore livrée) — la création du ticket est
        fonctionnelle dès maintenant, l'envoi effectif suivra au Bloc B/D.
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactCreation'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAccuse'
          description: ''
  /api/v1/demandes-visite:
    post:
      operationId: demandes_visite_create
      description: |-
        POST /api/v1/demandes-visite — dépôt public, idempotent (§6.1, CR-V-02).

        L'en-tête `Idempotency-Key` évite la création de doublons en cas de double clic
        ou de perte de connexion juste après l'envoi : une seconde requête avec la même
        clé renvoie l'accusé déjà émis au lieu de créer une nouvelle demande.
      tags:
      - demandes-visite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeVisiteCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemandeVisiteCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemandeVisiteCreation'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeVisiteAccuse'
          description: ''
  /api/v1/demandes-visite/{demande_id}/pieces:
    post:
      operationId: demandes_visite_pieces_create
      description: |-
        POST /api/v1/demandes-visite/{id}/pieces — téléversement de pièces (§7.3, étape 4).

        Accessible sans authentification tant que la demande n'est pas encore passée en
        instruction : l'UUID de la demande (non énumérable) fait office de jeton court
        pour ce dépôt en plusieurs étapes.
      parameters:
      - in: path
        name: demande_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - demandes-visite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PieceJointeVisite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PieceJointeVisite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PieceJointeVisite'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieceJointeVisite'
          description: ''
  /api/v1/demandes-visite/{numero_suivi}/permis/pdf:
    get:
      operationId: demandes_visite_permis_pdf_retrieve
      description: |-
        GET /api/v1/demandes-visite/{numero_suivi}/permis/pdf?code=... — accès public par le
        demandeur, sans connaître l'UUID interne (§6.2 : le suivi public n'expose que le
        numéro et le code, jamais l'identifiant technique).
      parameters:
      - in: path
        name: numero_suivi
        schema:
          type: string
        required: true
      tags:
      - demandes-visite
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/demandes-visite/{numero_suivi}/statut:
    get:
      operationId: demandes_visite_statut_retrieve
      description: GET /api/v1/demandes-visite/{numero}/statut?code=... — suivi public
        restreint.
      parameters:
      - in: path
        name: numero_suivi
        schema:
          type: string
        required: true
      tags:
      - demandes-visite
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeVisiteStatutPublique'
          description: ''
  /api/v1/demandes-visite/instruction:
    get:
      operationId: demandes_visite_instruction_list
      description: GET /api/v1/demandes-visite — file d'instruction (scope `visites:instruire`).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - demandes-visite
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandeVisiteInstructionList'
          description: ''
  /api/v1/demandes-visite/instruction/{id}:
    get:
      operationId: demandes_visite_instruction_retrieve
      description: GET /api/v1/demandes-visite/{id} — détail d'instruction (scope
        `visites:instruire`).
      parameters:
      - in: path
        name: id
        schema:
