components:
  schemas:
    ArticleBackoffice:
      type: object
      description: CRUD éditorial complet — auteur/dates en lecture seule, reste modifiable.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titre:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        chapo:
          type: string
