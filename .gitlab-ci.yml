stages:
  - qualite
  - test
  - build
  - scan

variables:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ci-secret-key-min-32-caracteres-pour-jwt
  POSTGRES_DB: dgap_test
  POSTGRES_USER: dgap
  POSTGRES_PASSWORD: dgap
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0

backend:qualite:
  stage: qualite
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libpq-dev
    - cd backend && pip install -e ".[dev]"
  script:
    - ruff check .
    - black --check .
    - mypy .

backend:test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
    - redis:7-alpine
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libpq-dev
    - cd backend && pip install -e ".[dev]"
  script:
    - python manage.py makemigrations --check --dry-run
    - python manage.py check
    - pytest

backend:audit-dependances:
  stage: scan
  image: python:3.12-slim
  before_script:
    - cd backend && pip install -e . pip-audit
  script:
    - pip-audit --strict --skip-editable

frontend:qualite-et-build:
  stage: test
  image: node:22-slim
  before_script:
    - corepack enable
    - cd frontend && pnpm install --frozen-lockfile=false
  script:
    - pnpm -r exec tsc --noEmit
    - pnpm -r lint
    - pnpm -r --filter=./apps/* build
    - pnpm --filter @dgap/ui build-storybook

frontend:audit-dependances:
  stage: scan
  image: node:22-slim
  before_script:
    - corepack enable
    - cd frontend && pnpm install --frozen-lockfile=false
  script:
    - pnpm audit --audit-level=high || true # non bloquant tant que le graphe de deps n'est pas stabilisé (Phase 0)

images:build-et-scan:
  stage: scan
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker build -t dgap-backend:ci ./backend
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 1 dgap-backend:ci
